# scrypto-audit-kit — packaging for the deterministic Python core + the MCP server.
#
# The kit is designed to run from a bare `git clone` with NO install: ./audit.sh, the
# bin/ scripts, and the test suite all work that way and this file changes none of it.
# What it ADDS is a pip-installable layer so agent developers can
#
#     pip install scrypto-audit-kit
#     from scrypto_audit_kit import static_analysis, sak_lib, attest, gen_tests
#
# plus console entry points (sak-static, sak-gate, ...). The full LLM audit (audit.sh) runs
# from a kit clone through an interchangeable backend (claude-api default / aider / your own);
# the pip package is the deterministic, no-API-key core and the MCP server. See docs/sdk.md
# and docs/backends.md.

[build-system]
# >=77 for PEP 639 (`license = "Apache-2.0"` + `license-files`). Floor, not a pin:
# a build backend that is too OLD fails loudly, whereas an unbounded newer one is
# how the deprecated license table was going to break the build unattended.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scrypto-audit-kit"
dynamic = ["version"]
description = "Pre-audit toolkit for Scrypto blueprints on Radix: deterministic static analysis, an LLM checklist pass, machine-readable reports, an MCP server, and on-chain attestation."
readme = "README.md"
# 3.9, not 3.8. setuptools 75.3.4 is the last release supporting 3.8, and PEP 639 license
# metadata needs >=77 — the two cannot coexist, so the sdist simply could not build on 3.8.
# Python 3.8 has been end-of-life since 2024-10, and a floor the project cannot build on is a
# claim, not a support commitment. (CI now tests this floor, which is how the conflict surfaced
# the moment the matrix landed rather than after a downstream packager hit it.)
requires-python = ">=3.9"
# PEP 639 SPDX form. The old `license = { text = ... }` table is deprecated with a hard removal
# date (setuptools 2027-02-18) and the build backend is unpinned above `>=64`, so leaving it
# meant the build breaks on a day nobody chose. The paired `License ::` classifier is removed
# because PEP 639 forbids carrying both.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "bigdev" }]
keywords = ["scrypto", "radix", "smart-contracts", "security", "audit", "static-analysis", "mcp", "defi", "web3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  # Per-version classifiers so PyPI's sidebar shows the real support surface rather than a bare
  # "Python :: 3". These must track `requires-python`.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# The deterministic core is stdlib-only by design — zero required dependencies.
dependencies = []

[project.optional-dependencies]
# Every published `mcp` release requires python >= 3.10, but this project's floor is 3.9 and the
# wheel is py3-none-any, so pip serves it to 3.9 users and then dies with an unresolvable
# "No matching distribution found for mcp[cli]". The marker makes the extra resolve to nothing
# there instead of erroring: the core still installs, the MCP server is simply absent — which is
# the truth on that version. Same for `dev`, or a contributor on the declared floor cannot
# install the extras the test suite documents.
#
# The <2 bound is load-bearing, not caution: mcp 2.0.0 removed `mcp.server.fastmcp`, which is
# what bin/mcp_server.py imports. Without the bound pip resolves 2.x and `sak-mcp` dies with
# "needs the MCP SDK: pip install mcp[cli]" — the exact thing the user just ran. Lifting it
# requires porting the server to the 2.x entry point first.
mcp = ["mcp[cli]>=1.0,<3; python_version >= '3.10'"]   # the MCP server (sak-mcp) — needs 3.10+
schema = ["jsonschema>=4.0"]     # opt-in report/contract schema validation
llm = ["anthropic>=0.40"]        # the default claude-api audit backend (bin/llm_audit.py)
dev = ["jsonschema>=4.0", "mcp[cli]>=1.0,<3; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/bigdevxrd/scrypto-audit-kit"
Repository = "https://github.com/bigdevxrd/scrypto-audit-kit"
Issues = "https://github.com/bigdevxrd/scrypto-audit-kit/issues"
Documentation = "https://github.com/bigdevxrd/scrypto-audit-kit/tree/main/docs"

# Console entry points map to the un-hyphenated, importable modules' main().
[project.scripts]
sak-static = "scrypto_audit_kit.static_analysis:main"
sak-gen-tests = "scrypto_audit_kit.gen_tests:main"
sak-attest = "scrypto_audit_kit.attest:main"
sak-gate = "scrypto_audit_kit.ci_gate:main"
sak-mcp = "scrypto_audit_kit.mcp_server:main"

# The existing bin/ directory IS the package — no files move, so the bare-clone run
# paths (audit.sh, the tests, .mcp.json) are untouched.
[tool.setuptools]
package-dir = { "scrypto_audit_kit" = "bin" }
packages = ["scrypto_audit_kit"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
