# Copy this into .github/workflows/pre-audit.yml in YOUR Scrypto repo.
#
# Setup:
#   1. Add a repo secret named ANTHROPIC_API_KEY (Settings → Secrets → Actions).
#   2. Point `package` at your blueprint (the dir with Cargo.toml + src/lib.rs).
#   3. Add the badge to your README — see docs/ci.md.
#
# It runs scrypto-audit-kit on every PR and fails if a High/Critical issue is found.
name: pre-audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrypto-pre-audit:
    # Pin the kit to a release tag/SHA for reproducible, supply-chain-safe runs (not @main —
    # that runs whatever is on the kit's HEAD in your CI, with your ANTHROPIC_API_KEY in reach).
    # Two refs, both worth pinning: this one picks the workflow, `kit-ref` picks the audit code
    # it checks out. Bump them together when you want newer checks.
    #
    # v0.7.1 is a floor, not just the newest tag — every earlier tag lets the package you are
    # auditing run code in your CI job. v0.7.0 and earlier probe the backend with
    # `python3 -c 'import anthropic'` in the AUDITED tree, and python puts the cwd on sys.path
    # for -c, so a package shipping its own anthropic.py executes one step before your
    # ANTHROPIC_API_KEY enters the job (and satisfies the probe, so the guard passes anyway).
    # v0.5.0/v0.6.0 additionally interpolate caller inputs into `run:` scripts. If v0.7.1 is not
    # tagged yet, pin a commit SHA from the kit's main rather than falling back to an older tag.
    uses: bigdevxrd/scrypto-audit-kit/.github/workflows/pre-audit.yml@v0.7.1
    with:
      package: packages/my-blueprint   # ← change to your package path
      fail-on: high                     # block on high + critical; use `critical` to be lenient
      kit-ref: v0.7.1                   # the audit code; defaults to main (unpinned) if omitted
      # model: claude                   # claude is the only value CI can authenticate; the
      #                                 # deepseek/both cross-model modes need a DEEPSEEK_API_KEY
      #                                 # this workflow never forwards — see docs/ci.md
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
