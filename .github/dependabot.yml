# Dependabot keeps the SHA-pinned actions moving.
#
# SHA-pinning without automated updates is how a project ends up frozen on an action release with
# a known advisory — the pin that was a security control becomes the thing keeping the bug. These
# two halves only work together, which is why they landed in the same change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      # One PR for the routine bumps; anything that needs thought still arrives alone.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The deterministic core has zero required dependencies by design — this watches the optional
  # extras (anthropic, mcp, jsonschema), which is where an advisory would actually land.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The `mcp[cli]<2` bound is load-bearing, not staleness: mcp 2.0.0 removed
      # `mcp.server.fastmcp`, which bin/mcp_server.py imports, so widening it silently breaks
      # `sak-mcp` for everyone who installs the [mcp] extra. Dependabot proposed exactly that
      # within minutes of being enabled. Lifting the bound requires PORTING the server to the
      # 2.x entry point first — a code change, not a metadata bump — so major bumps of this
      # dependency are ignored on purpose. Remove this entry as part of that port.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # The attestation blueprint's Rust dependencies. It is a reference implementation that has not
  # been deployed, but it is compile-checked in CI and is the thing an auditor reads.
  - package-ecosystem: cargo
    directory: /attestation
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(attestation)"
