# Compile-check the attestation reference blueprint. Runs only when it changes, so it
# doesn't tax the common (Python/bash) path. Host target — the wasm32 build needs Linux
# toolchain setup and isn't required just to catch type errors.
name: blueprint

on:
  push:
    branches: [main]
    paths: ['attestation/**']
  pull_request:
    paths: ['attestation/**']

# Least privilege: without an explicit block the token scope is whatever the repo's
# default happens to be — a web setting that can be widened without touching this file.
# Neither job writes anything.
permissions:
  contents: read

jobs:
  cargo-check:
    name: cargo check (attestation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to a SHA like every other action. NOTE: for this action the ref name is
      # the toolchain channel (branch `stable`), so a SHA freezes BOTH the action code
      # and which toolchain it selects — Dependabot moves it forward.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: attestation
      - run: cargo check --manifest-path attestation/Cargo.toml
