name: secret-scan

# Secret-scanning guardrail. Scans the FULL git history on every PR and every
# push to main. Config lives in .gitleaks.toml. Pinned + checksum-verified
# gitleaks binary so the scan is reproducible and cannot silently drift to a
# newer ruleset without a deliberate version bump here.

on:
  # No branch filter on pull_request so a PR based on a non-default branch
  # still gets scanned.
  pull_request:
  push:
    branches: [main]
  # On-demand rescan of a branch that has no open PR of its own (e.g. a
  # long-lived base branch after its original PR closed). Costs nothing
  # unless invoked.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned + checksum-verified below. Bump in lockstep with any local
      # install and with .gitleaks.toml's documented version.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — gitleaks scans every commit, not just the diff.
          fetch-depth: 0

      - name: refuse to scan a shallow clone (fail closed)
        # --log-opts=HEAD below scopes gitleaks to commits reachable from HEAD
        # instead of gitleaks' default of every ref the checkout pulled down
        # (see the scan step). That is only equivalent to a full history scan
        # because `fetch-depth: 0` above makes HEAD's own history complete. If
        # depth were ever shallowed, `--log-opts=HEAD` would walk whatever few
        # commits a shallow clone happens to hold, gitleaks would report
        # "0 leaks" having examined almost nothing, and the job would go green
        # having proven nothing. This step makes that failure loud instead of
        # silent, and runs it BEFORE installing gitleaks so a shallow checkout
        # fails in seconds rather than after a download.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::This checkout is SHALLOW. gitleaks git --log-opts=HEAD only sees commits present locally, so a shallow clone reports a false '0 leaks' instead of failing. Fix: restore 'fetch-depth: 0' on the checkout step above. Refusing to run the scan." >&2
            exit 1
          fi

      - name: install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: scan git history
        # Exits non-zero if any secret is found (default exit code 1).
        # --redact keeps real secret values out of CI logs. --log-opts=HEAD
        # scopes the walk to commits reachable from HEAD — on pull_request,
        # checkout gives us refs/pull/N/merge, so that is the PR's commits
        # plus the whole base branch: every commit that could reach main is
        # still scanned, in full, every time. What it stops scanning is
        # unmerged sibling branches, which gitleaks' default (every ref
        # fetch-depth: 0 pulled down) otherwise walks too — one bad commit on
        # an unrelated branch would otherwise fail every open PR at once.
        # Preceded by the shallow-clone guard above, which is what keeps this
        # scoping from ever running unchecked against a truncated history.
        #
        # CAVEAT, deliberately left open: if this repo is ever made public by
        # flipping visibility with all refs intact — rather than a fresh
        # squashed re-cut — unmerged branches become public too and this
        # scoping would not have covered them. Sweep all refs by hand first:
        #   gitleaks git -c .gitleaks.toml   (no --log-opts)
        run: gitleaks git --no-banner --redact -c .gitleaks.toml --log-opts=HEAD
